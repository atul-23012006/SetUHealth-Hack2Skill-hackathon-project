name: Keep backend warm

# Render's free tier sleeps after ~15 min idle and takes 30-90s to wake.
# Pinging /api/health every 10 min keeps the first real visit fast.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 120 --retry 2 https://setuhealth-hack2skill-hackathon-project.onrender.com/api/health
