[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately curated, not "ALL": E/F/W (pycodestyle/pyflakes) + I (import
# order) + UP (pyupgrade) + B (bugbear) + C4 (comprehensions) catch real bugs
# and dead code with near-zero false positives on this codebase. Left out:
# BLE/S (blind `except Exception`) — several services deliberately degrade
# rather than fail (see genai.py, live_data.py) and a blanket rule would
# flag the intended pattern; DTZ (naive datetime) and SIM (branch
# simplification) are style calls, not correctness.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # FastAPI's `Depends(...)` default-argument idiom, not a bug
    "E501",  # line length: this codebase runs long data-literal/prose lines by convention
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

# The data/services layer models facility, stock and API-payload records as
# plain dicts (see CLAUDE.md's "generic resource model" note) rather than
# TypedDicts/pydantic models, so mypy can't narrow them today — these
# pre-existing gaps are tracked here rather than silenced inline so new code
# in these files is still checked for everything mypy *can* see, and
# `mypy app` stays a meaningful gate for every other module. Narrowing the
# dict-based records (or moving them to pydantic models) would let these
# come off this list.
[[tool.mypy.overrides]]
module = [
    "app.data.generate_data",
    "app.data.resource_types",
    "app.main",
    "app.routers.assistant",
    "app.scripts.manage_users",
    "app.services.anomaly",
    "app.services.db",
    "app.services.federated",
    "app.services.forecasting",
    "app.services.live_data",
]
ignore_errors = true
